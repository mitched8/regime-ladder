# Archetype conventions — DOCUMENT what the source defines; do not choose here. Fill in at WU-03.
#
# Two kinds of entry:
#   base legs   — what the backtester runs: single structures hedged leg by leg
#   combinations — weight vectors over base legs (combine.py); exact by aggregation, no new runs
# Scaling (DECISIONS D14): default is one unit of VEGA at inception per base leg, so combination weights
# are vega units and a zero-sum weight vector is smile-vega-neutral by construction.

base_legs:
  straddle_atm:
    legs: "long ATM call + long ATM put, same expiry"
    hedge_rule: "<as applied by the source: delta frequency; vega hedge instrument if any>"
    notional_unit: "<source standard notional; rescaled to 1 vega at inception when `vega` is available>"
    currency: "<P&L currency>"
  put_25d:  {legs: "long 25-delta put",  hedge_rule: "<as source>", notional_unit: "<as above>", currency: "<P&L currency>"}
  call_25d: {legs: "long 25-delta call", hedge_rule: "<as source>", notional_unit: "<as above>", currency: "<P&L currency>"}
  put_10d:  {legs: "long 10-delta put",  hedge_rule: "<as source>", notional_unit: "<as above>", currency: "<P&L currency>"}
  call_10d: {legs: "long 10-delta call", hedge_rule: "<as source>", notional_unit: "<as above>", currency: "<P&L currency>"}

# Standard combinations, weights in vega units (combine.STANDARD_COMBOS mirrors these).
# If the source also runs these as packages with its own ratio rule, keep both and reconcile at WU-03:
# the package series and the combination of legs should agree up to the ratio convention.
combinations:
  rr_25d:  {call_25d: 1.0, put_25d: -1.0}
  rr_10d:  {call_10d: 1.0, put_10d: -1.0}
  fly_10d: {call_10d: 0.5, put_10d: 0.5, straddle_atm: -1.0}
  fly_25d: {call_25d: 0.5, put_25d: 0.5, straddle_atm: -1.0}

# Tenors (DECISIONS D15): any major tenor from 1W to 1Y is available. Phase 3 default below;
# horizons are capped at tenor automatically (a 1W component has rungs 1/3/5; 1Y adds 40 and 60).
tenors_phase3: [5, 21, 63]          # 1W, 1M, 3M in trading days
tenors_available: [5, 10, 21, 42, 63, 126, 252]
