# Pre-registered gates. Thresholds are changed only by the research owner, with the reason
# recorded in DECISIONS.md. The agent reads this file; it does not edit it.
phase1:
  golden_abs_tol: 1.0e-6          # golden trades must reproduce to this absolute tolerance (per day, per unit)

phase2:
  max_h: 10                       # separation is required at h <= 10
  min_spread_se: 2.0              # best-minus-worst regime mean > 2 x larger SE
  min_fraction_cells: 0.75        # ... in at least 75% of (group, h) cells

phase3:
  max_h: 10                       # go/no-go judged at h <= 10
  min_improvement: 0.0            # out-of-sample MSE improvement over unconditional must be positive
  min_rank_ic: 0.0                # Spearman between predicted and realised must be positive
  calib_slope: [0.5, 1.5]         # realised-on-predicted slope within this range

phase4_leading:                   # Gate 4: a leading feature (and the pressure index built from the retained ones) has incremental value
  min_delta_r2: 0.005             # out-of-sample R^2 gain of the forward outcome beyond named state + continuous state score
  min_transition_gain: 0.002      # out-of-sample transition log-likelihood gain per transition (nats) through the tilt
  min_folds_up: 3                 # ... each positive in at least this many of the walk-forward folds (of 4)
  n_perm: 100                     # selection control: permutation null for the outcome gain (circular shifts of the feature, >= 63 days)
  max_p_perm: 0.05                # ... a retained feature's gain must beat that null at this level
  holdout_frac: 0.2               # guard: the walk-forward runs on the first 80% of the history; the top 3 retained candidates are then
  max_to_holdout: 3               # ... tested once on the final 20% and must not be CONTRADICTED there (each test above minus its threshold)
