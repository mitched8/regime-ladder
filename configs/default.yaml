# Research configuration. Change here, never in code. Record changes in DECISIONS.md.
horizons: [1, 3, 5, 10, 20, 40, 60]   # to-expiry is always added; rungs above a component's tenor are dropped
alpha: 0.10                       # 90% intervals
ci: boot                          # boot (circular block bootstrap, better calibrated) | hac (Newey-West, faster)
n_boot: 1000
kappa: 20                         # shrinkage prior strength (effective observations)

labeller:
  features: [vol_pct, term_slope_pct, rr_stress_pct]
  states: 6                       # 6 = level x direction (carry, rising, agitated, stressed, normalising, settling);
                                  # 6x = plus the extreme band (merged into stressed when it has < min_episodes episodes);
                                  # 3 = level only (carry, transition, crisis); auto = best partition on the target
  calibrate: true                 # run labels.calibrate_states on the training window; else use the fixed values below
  target: forward_pnl             # partition/direction/hysteresis scored on: forward_pnl (archetype's forward 5d earn; needs backtester) | forward_rv
  level_target: atm_1m            # level BOUNDS step-fitted on this column shifted forward by level_horizon days (surface fact; whole history)
  level_horizon: 5
  halflife: 3                     # fixed fallbacks, used when calibrate is false
  bounds: [45, 73]                # two bounds -> low/mid/high; three -> plus extreme
  delta: 3
  dir_k: 0.75                     # direction thresholds at +/- dir_k x sd(slope)
  max_switches_per_year: 30
  min_episodes: 5

eval:
  n_splits: 4                     # walk-forward test windows after a 40% initial training block
  kappa: 0                        # 0 scores raw state means; set to the ladder's kappa to score the shrunk estimate the card shows

tags:                             # qualifiers that split a state's ladder where the (state, tag) cell has enough episodes (tags.py)
  min_episodes: 5                 # a tagged cell with fewer episodes collapses back to its parent state
  corr_sign: {window: 21, band: 0.2, delta: 0.05}        # sign of trailing spot-vol correlation: neg / flat / pos
  pinned: {window: 21, rv_ratio: 0.6, range_ratio: 0.6}  # realised well under implied and spot in a narrow range
  event_window: {before: 3, after: 1}                    # applied to the `events` calendar below (dates known in advance)
  events: []                      # scheduled dates (central bank, data, elections); the adapter can fill this per pair
  pairs:                          # per-pair tags and overrides; USDJPY shows the BoJ-style configuration
    USDJPY:
      intervention_risk: {direction: 1, move_window: 21, move_threshold: 0.05, level: null, flag_col: official_comment}
