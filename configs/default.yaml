# Research configuration. Change here, never in code. Record changes in DECISIONS.md.
horizons: [1, 3, 5, 10, 20, 40, 60]   # to-expiry is always added; rungs above a component's tenor are dropped
alpha: 0.10                       # 90% intervals
ci: boot                          # boot (circular block bootstrap, better calibrated) | hac (Newey-West, faster)
n_boot: 1000
kappa: 20                         # shrinkage prior strength (effective observations)

labeller:
  features: [vol_pct, term_slope_pct, rr_stress_pct]
  states: 5                       # 5 = level x direction (carry, rising, crisis, normalising, settling); 3 = level only
  calibrate: true                 # run labels.calibrate_states on the training window; else use the fixed values below
  target: forward_pnl             # forward_pnl (archetype's forward 5d earn; needs backtester) | forward_rv (10-year surface only)
  halflife: 3                     # fixed fallbacks, used when calibrate is false
  b1: 40
  b2: 72
  delta: 3
  dir_k: 0.75                     # direction thresholds at +/- dir_k x sd(slope)
  max_switches_per_year: 30
  min_episodes: 5

eval:
  n_splits: 4                     # walk-forward test windows after a 40% initial training block
