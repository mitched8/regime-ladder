<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--ink:#1a1d23;--muted:#5f6670;--rule:#d9dce1;--bg:#f6f7f9;--ind:#4F46E5;--pos:#2EAE7A;--neg:#E8743B}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5}
header{padding:14px 20px 8px;border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline}
header h1{font-size:17px;margin:0;font-weight:600}
header .dim{color:var(--muted);font-size:12.5px}
nav{display:flex;gap:2px;padding:6px 20px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 12px;font:inherit;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--ink);border-bottom-color:var(--ind);font-weight:600}
#filters{padding:8px 20px;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:6px 26px;font-size:12.5px}
#filters:empty{display:none}
.frow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.frow .lbl{color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-size:10.5px;margin-right:3px}
.chip{border:1px solid var(--rule);background:#fff;border-radius:12px;padding:1px 9px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--ink);color:var(--ink);background:#fff}
.chip.on.st{color:#fff;border-color:transparent}
.mini{font-size:11px;color:var(--muted);cursor:pointer;text-decoration:underline;margin-left:2px}
main{padding:14px 20px 40px;max-width:1500px}
.ctl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:0 0 12px;font-size:13px}
.ctl label{color:var(--muted)} .ctl select,.ctl input{font:inherit;font-size:13px;padding:2px 4px;border:1px solid var(--rule);border-radius:3px;background:#fff}
.ctl .tog{cursor:pointer;user-select:none} .ctl .tog input{margin-right:4px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:14px 22px}
.grid.one{grid-template-columns:minmax(0,820px)}
.panel{border:1px solid var(--rule);border-radius:4px;padding:8px 10px 4px;background:#fff}
.panel h3{font-size:13px;margin:0 0 4px;font-weight:600}
svg{width:100%;height:auto;display:block;overflow:visible}
svg text{font-family:Inter,system-ui,sans-serif;font-size:11px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin:8px 0 14px;color:var(--muted)}
.legend span.sw{display:inline-block;width:22px;height:0;border-top:2.5px solid;vertical-align:middle;margin-right:5px}
.note{color:var(--muted);font-size:12.5px;margin:6px 0 14px}
h2{font-size:15px;margin:22px 0 6px;font-weight:600}
h2:first-child{margin-top:4px}
table{border-collapse:collapse;font-size:12.5px;margin:6px 0 14px}
th{text-align:left;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:5px 8px;border-bottom:1px solid var(--ink);vertical-align:bottom;white-space:nowrap;cursor:pointer}
td{padding:4px 8px;border-bottom:1px solid var(--rule);vertical-align:top;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.hi td{background:#eef7f1} tr.dimr td{color:var(--muted)}
.hm td{text-align:right;font-variant-numeric:tabular-nums;min-width:66px;cursor:pointer}
.hm td.thin{opacity:.45} .hm td.today{outline:2px solid var(--ink);outline-offset:-2px} .hm th.today{color:var(--ink)}
.hm td.rowh{text-align:left;cursor:default;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{border:1px solid var(--rule);border-radius:4px;padding:10px 14px;background:var(--bg)} .card h3{margin:0 0 6px;font-size:14px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:12.5px} .card dt{color:var(--muted)} .card dd{margin:0}
.badge{display:inline-block;padding:0 8px;border-radius:10px;color:#fff;font-size:12px;font-weight:600}
.pass{color:var(--pos);font-weight:600} .fail{color:var(--neg);font-weight:600}
.empty{color:var(--muted);padding:30px 0;font-size:13.5px}
@media (max-width:700px){header,nav,#filters,main{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}.grid.one{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1 id="title"></h1><span class="dim" id="sub"></span></header>
<nav id="nav"></nav>
<div id="filters"></div>
<main id="main"></main>
<script id="data" type="application/json">__DATA__</script>
<script>
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const ORDER = ['ALL','carry','settling','rising','agitated','normalising','stressed','extreme'];
const COL = {carry:'#3B6FD4',rising:'#2EAE7A',agitated:'#D4A017',stressed:'#E8743B',extreme:'#B91C1C',normalising:'#8B5CF6',settling:'#0EA5E9',transition:'#D4A017',crisis:'#E8743B',ALL:'#6B7280'};
const PAL = ['#4F46E5','#E8743B','#2EAE7A','#D4A017','#0EA5E9','#8B5CF6','#B91C1C','#6B7280','#1a1d23','#F472B6'];
const DASH = ['', '7 4', '2 3', '9 3 2 3', '14 4', '4 2 1 2'];
const LAB = {pair:'pair', archetype:'strategy', tenor_days:'tenor', regime:'entry state', h:'horizon'};
const LADDER_METRICS = [['mean_shrunk','EV, shrunk'],['mean','EV'],['p_profit','P(profit)'],['q50','median'],['q05','5th pct'],['q95','95th pct'],['es05','ES 5%'],['se','standard error'],['n_eff','n_eff'],['episodes','episodes'],['earn_per_day','earn per day (increments)']];
const WF_METRICS = [['improvement','MSE improvement vs unconditional'],['rank_ic','rank IC'],['calib_slope','calibration slope'],['n_test','n_test']];
const HAS_EXPLORE = D.pairs.some(p => D.tables[p].explore && Object.keys(D.tables[p].explore.entries || {}).length);
const TABS = (HAS_EXPLORE ? [['explore','Explore']] : []).concat([['overview','Overview'],['ladder','Ladder'],['matrix','Matrix'],['oos','Out of sample'],['states','States'],['finder','Finder'],['transitions','Transitions'],['shock','Shock'],['leading','Leading']]).concat(D.sweep ? [['sweep','Sweep']] : []);

const HAS_LADDER = D.ladder && D.ladder.length > 0;
const cmp = k => (a, b) => k === 'regime' ? ORDER.indexOf(a) - ORDER.indexOf(b) : (typeof a === 'number' && typeof b === 'number' ? a - b : String(a).localeCompare(String(b)));
const uniq = (rows, k) => [...new Set(rows.map(r => r[k]))].filter(v => v !== null && v !== undefined).sort(cmp(k));
const fmt = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v)) ? '·' : (typeof v !== 'number' ? String(v) : (Math.abs(v) >= 1000 ? v.toFixed(0) : v.toFixed(d)));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const sum = a => a.reduce((x, y) => x + y, 0);

const U = {
  tab: HAS_EXPLORE ? 'explore' : 'overview', pair: D.pairs[0], sort: {},
  ex: {key: null, h: 5, hl: 20, comps: false, c1: null, c2: null, and2: false, saved: [], bstat: null, nb: 5},
  f: {pair: new Set([D.pairs[0]]),
      archetype: new Set(HAS_LADDER ? uniq(D.ladder, 'archetype') : []),
      tenor_days: new Set(HAS_LADDER ? [uniq(D.ladder, 'tenor_days')[0]] : []),
      regime: new Set(HAS_LADDER ? uniq(D.ladder, 'regime').filter(r => r !== 'extreme') : [])},
  lad: {x: 'h', lines: 'regime', panels: 'archetype', metric: 'mean_shrunk', vsAll: false, ci: false, hAt: 5},
  mat: {h: 5, metric: 'mean_shrunk', rows: {pair: true, archetype: true, tenor_days: true}, vsAll: false},
  wf: {lines: 'archetype', panels: 'pair', metric: 'improvement'},
  ts: {years: 'all'}, lead: {feats: null},
};

/* ---------- generic drawing ---------- */
function niceTicks(lo, hi, n = 5) {
  if (!(hi > lo)) { hi = lo + 1; lo = lo - 1; }
  const raw = (hi - lo) / n, p = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / p;
  const step = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * p;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10)); return out;
}
/* series: [{label, colour, dash, pts:[{xi, y, lo, hi, tip, hollow}]}]; opt: {xcats, W, H, zero, ylabel, pct, bands, xticks, hlines, marks} */
function svgLines(series, opt) {
  const W = opt.W || 560, H = opt.H || 300, m = {l: 50, r: 12, t: 12, b: 30}, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const n = opt.xcats ? opt.xcats.length : opt.n, xs = i => m.l + (i + 0.5) * iw / n, xe = i => m.l + i * iw / n;
  let lo = Infinity, hi = -Infinity;
  for (const s of series) for (const p of s.pts) for (const v of [p.y, p.lo, p.hi]) if (v !== null && v !== undefined && !Number.isNaN(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (opt.pct) { lo = 0; hi = 100; } if (opt.unit) { lo = Math.min(lo, 0); hi = Math.max(hi, 1); }
  if (opt.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (!isFinite(lo)) { lo = 0; hi = 1; } if (hi === lo) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.06; if (!opt.pct && !opt.unit) { lo -= pad; hi += pad; }
  const ys = v => m.t + ih - (v - lo) / (hi - lo) * ih;
  let g = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  if (opt.bands) for (const b of opt.bands) g += `<rect x="${xe(b.i0).toFixed(1)}" y="${m.t}" width="${(xe(b.i1 + 1) - xe(b.i0)).toFixed(1)}" height="${ih}" fill="${b.colour || COL[b.state] || '#ccc'}" opacity="${b.opacity || 0.13}"/>`;
  for (const t of niceTicks(lo, hi)) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${ys(t).toFixed(1)}" y2="${ys(t).toFixed(1)}" stroke="${t === 0 ? '#555' : '#e6e8ec'}" stroke-width="${t === 0 ? 1 : 0.8}"/><text x="${m.l - 6}" y="${(ys(t) + 3.5).toFixed(1)}" text-anchor="end">${fmt(t, Math.abs(t) < 1 && t !== 0 ? 2 : (Math.abs(t) < 10 ? 1 : 0))}</text>`;
  if (opt.vlines) for (const l of opt.vlines) { const X = (m.l + (l.xi + 0.5) * iw / n).toFixed(1); g += `<line x1="${X}" x2="${X}" y1="${m.t}" y2="${m.t + ih}" stroke="${l.colour || '#1a1d23'}" stroke-dasharray="5 3"/><text x="${X}" y="${m.t - 2}" text-anchor="middle">${esc(l.label || '')}</text>`; }
  if (opt.hlines) for (const l of opt.hlines) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${ys(l.y).toFixed(1)}" y2="${ys(l.y).toFixed(1)}" stroke="${l.colour || '#999'}" stroke-dasharray="4 3"/><text x="${W - m.r - 2}" y="${(ys(l.y) - 3).toFixed(1)}" text-anchor="end">${esc(l.label || '')}</text>`;
  const xt = opt.xticks || (opt.xcats || []).map((c, i) => ({i, label: c}));
  for (const t of xt) g += `<text x="${xs(t.i).toFixed(1)}" y="${H - m.b + 15}" text-anchor="middle">${esc(t.label)}</text>${opt.xticks ? `<line x1="${xs(t.i).toFixed(1)}" x2="${xs(t.i).toFixed(1)}" y1="${m.t + ih}" y2="${m.t + ih + 4}" stroke="#999"/>` : ''}`;
  if (opt.xlabel) g += `<text x="${m.l + iw / 2}" y="${H - 2}" text-anchor="middle">${esc(opt.xlabel)}</text>`;
  if (opt.ylabel) g += `<text transform="translate(11 ${m.t + ih / 2}) rotate(-90)" text-anchor="middle">${esc(opt.ylabel)}</text>`;
  for (const s of series) {
    const has = p => p.y !== null && p.y !== undefined && !Number.isNaN(p.y);
    if (s.pts.some(p => p.lo !== undefined && p.lo !== null)) {
      const up = s.pts.filter(p => has(p) && p.hi !== null).map(p => `${xs(p.xi).toFixed(1)},${ys(p.hi).toFixed(1)}`);
      const dn = s.pts.filter(p => has(p) && p.lo !== null).map(p => `${xs(p.xi).toFixed(1)},${ys(p.lo).toFixed(1)}`).reverse();
      if (up.length > 1) g += `<polygon points="${up.concat(dn).join(' ')}" fill="${s.colour}" opacity="0.12"/>`;
    }
    if (s.scatter) { for (const p of s.pts) if (has(p)) g += `<circle cx="${xs(p.xi).toFixed(1)}" cy="${ys(p.y).toFixed(1)}" r="${s.r || 1.7}" fill="${s.colour}" opacity="${s.opacity || 0.45}"><title>${esc(p.tip || '')}</title></circle>`; continue; }
    let d = '', pen = false;
    for (const p of s.pts) { if (!has(p)) { pen = false; continue; } d += `${pen ? 'L' : 'M'}${xs(p.xi).toFixed(1)} ${ys(p.y).toFixed(1)}`; pen = true; }
    g += `<path d="${d}" fill="none" stroke="${s.colour}" stroke-width="${s.width || 1.8}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''} stroke-linejoin="round"/>`;
    if (!opt.nodots) for (const p of s.pts) if (has(p)) g += `<circle cx="${xs(p.xi).toFixed(1)}" cy="${ys(p.y).toFixed(1)}" r="3.4" fill="${p.hollow ? '#fff' : s.colour}" stroke="${s.colour}" stroke-width="1.6"><title>${esc(p.tip || '')}</title></circle>`;
  }
  if (opt.marks) for (const k of opt.marks) g += `<path d="M${xs(k.i).toFixed(1)} ${m.t + 2} l-4 -8 l8 0 z" fill="${k.colour || '#B91C1C'}"><title>${esc(k.tip || '')}</title></path>`;
  return g + '</svg>';
}
function legendHTML(items) { return `<div class="legend">${items.map(i => `<span><span class="sw" style="border-color:${i.colour};border-top-style:${i.dash ? (i.dash.startsWith('2') ? 'dotted' : 'dashed') : 'solid'}"></span>${esc(i.label)}</span>`).join('')}</div>`; }

function tableHTML(id, rows, cols, opt = {}) {
  const s = U.sort[id];
  if (s) rows = [...rows].sort((a, b) => { const x = a[s.k], y = b[s.k]; const c = (x === null || x === undefined) ? 1 : (y === null || y === undefined) ? -1 : cmp(s.k)(x, y); return s.d ? -c : c; });
  let h = `<table data-t="${id}"><thead><tr>${cols.map(c => `<th class="${c.num ? 'num' : ''}" data-k="${c.k}">${esc(c.label || c.k)}${s && s.k === c.k ? (s.d ? ' ▾' : ' ▴') : ''}</th>`).join('')}</tr></thead><tbody>`;
  for (const r of rows) h += `<tr class="${opt.rowClass ? opt.rowClass(r) : ''}">${cols.map(c => `<td class="${c.num ? 'num' : ''}" ${c.style ? `style="${c.style(r[c.k], r)}"` : ''}>${c.f ? c.f(r[c.k], r) : (c.num ? fmt(r[c.k], c.d === undefined ? 2 : c.d) : esc(r[c.k] === null || r[c.k] === undefined ? '·' : r[c.k]))}</td>`).join('')}</tr>`;
  return h + '</tbody></table>';
}
function divCol(v, vmax) { if (v === null || v === undefined || !vmax) return ''; const a = Math.min(0.75, Math.abs(v) / vmax * 0.75); return `background:${v >= 0 ? `rgba(46,174,122,${a.toFixed(2)})` : `rgba(232,116,59,${a.toFixed(2)})`}`; }

/* ---------- pivot over ladder-shaped tables ---------- */
function filtered(rows, dims) { return rows.filter(r => dims.every(d => !U.f[d] || U.f[d].has(r[d]))); }
function pivot(rows, dims, o) {
  const x = o.x || 'h';
  let base = rows;
  if (o.metric === 'earn_per_day') base = D.increments.map(r => Object.assign({}, r, {h: r.h_to, to_expiry: false}));
  let allMap = null;
  if (o.vsAll) { allMap = new Map(); for (const r of base) if (r.regime === 'ALL') allMap.set([r.pair, r.archetype, r.tenor_days, r.h].join('|'), r); }
  let rs = filtered(base, dims); if (o.vsAll) rs = rs.filter(r => r.regime !== 'ALL');
  if (x === 'tenor_days') rs = rs.filter(r => o.hAt === 'exp' ? r.to_expiry : (r.h === o.hAt && !r.to_expiry));
  const val = r => { const v = r[o.metric]; if (v === null || v === undefined) return null; if (!allMap) return v; const a = allMap.get([r.pair, r.archetype, r.tenor_days, r.h].join('|')); return a && a[o.metric] !== null ? v - a[o.metric] : null; };
  const shift = r => { if (!allMap) return 0; const a = allMap.get([r.pair, r.archetype, r.tenor_days, r.h].join('|')); return a ? a[o.metric] : 0; };
  const {panelsDim, linesDim, others} = resolve(dims, o);
  const xcats = uniq(rs, x);
  const panels = panelsDim ? uniq(rs, panelsDim).map(v => ({title: `${LAB[panelsDim]} ${v}`, rows: rs.filter(r => r[panelsDim] === v)})) : [{title: '', rows: rs}];
  const lineVals = linesDim ? uniq(rs, linesDim) : [''];
  const comboKey = r => others.map(d => r[d]).join(' · ');
  const combos = [...new Set(rs.map(comboKey))].sort();
  const ci = o.ci && (o.metric === 'mean' || o.metric === 'mean_shrunk');
  const out = panels.map(p => {
    const series = [];
    for (const lv of lineVals) for (const cb of combos) {
      const pr = p.rows.filter(r => (!linesDim || r[linesDim] === lv) && comboKey(r) === cb).sort((a, b) => a[x] - b[x]);
      if (!pr.length) continue;
      const colour = linesDim === 'regime' ? (COL[lv] || '#999') : PAL[lineVals.indexOf(lv) % PAL.length];
      series.push({label: [lv, cb].filter(Boolean).join(' · '), colour, dash: DASH[combos.indexOf(cb) % DASH.length],
        pts: pr.map(r => ({xi: xcats.indexOf(r[x]), y: val(r), lo: ci && r.ci_lo !== null ? r.ci_lo - shift(r) : undefined, hi: ci && r.ci_hi !== null ? r.ci_hi - shift(r) : undefined, hollow: !!r.to_expiry,
          tip: `${r.pair} ${r.archetype} ${r.tenor_days}d · ${r.regime ? r.regime + ' entry · ' : ''}h=${r.h}${r.to_expiry ? ' (expiry)' : ''}\n${o.metric}: ${fmt(val(r), 3)}${r.n_eff !== undefined ? `\nn_eff ${fmt(r.n_eff, 0)} · episodes ${fmt(r.episodes, 0)}` : ''}${r.ci_lo !== undefined && r.ci_lo !== null ? `\nCI [${fmt(r.ci_lo)}, ${fmt(r.ci_hi)}]` : ''}`}))});
    }
    return {title: p.title, series};
  });
  const legend = [];
  if (linesDim) for (const lv of lineVals) legend.push({label: `${lv}`, colour: linesDim === 'regime' ? (COL[lv] || '#999') : PAL[lineVals.indexOf(lv) % PAL.length]});
  if (combos.length > 1) for (const cb of combos) legend.push({label: cb, colour: '#555', dash: DASH[combos.indexOf(cb) % DASH.length]});
  return {panels: out, xcats: xcats.map(c => x === 'h' ? String(c) : `${c}d`), legend, linesDim, others, combos: combos.length, n: rs.length};
}
function pivotHTML(pv, o, ylabel) {
  if (!pv.n) return '<div class="empty">Nothing matches the filters.</div>';
  const one = pv.panels.length === 1;
  let h = `<div class="grid ${one ? 'one' : ''}">`;
  for (const p of pv.panels) h += `<div class="panel">${p.title ? `<h3>${esc(p.title)}</h3>` : ''}${svgLines(p.series, {xcats: pv.xcats, W: one ? 820 : 560, H: one ? 360 : 290, zero: true, xlabel: o.x === 'h' ? 'horizon (trading days; hollow = to expiry)' : `tenor (at h=${o.hAt})`, ylabel})}</div>`;
  h += '</div>' + legendHTML(pv.legend);
  if (pv.combos > 1) h += `<div class="note">Colour = ${LAB[pv.linesDim]}; dash pattern = ${pv.others.map(d => LAB[d]).join(' · ')}. Narrow the filters to one value of those to compare on colour alone.</div>`;
  return h;
}

/* pin: when the comparison axes change, leave one value in every other dimension so colour means one thing */
function resolve(dims, o) {
  const x = o.x || 'h', panelsDim = o.panels !== 'none' && o.panels !== x ? o.panels : null;
  let linesDim = o.lines; if (linesDim === x || linesDim === panelsDim) linesDim = dims.find(d => d !== x && d !== panelsDim) || null;
  return {x, panelsDim, linesDim, others: dims.filter(d => d !== x && d !== panelsDim && d !== linesDim)};
}
function pin(dims, o, src) {
  const r = resolve(dims, o); o.lines = r.linesDim || o.lines;
  for (const d of r.others) if (U.f[d].size > 1) {
    const have = uniq(src, d).filter(v => U.f[d].has(v));
    U.f[d] = new Set([d === 'regime' && have.includes('ALL') ? 'ALL' : have[0]]);
  }
}
/* ---------- filter bar ---------- */
function filterBar() {
  const box = document.getElementById('filters'); box.innerHTML = '';
  if (!['ladder', 'matrix', 'oos'].includes(U.tab) || !HAS_LADDER) return;
  const dims = U.tab === 'oos' ? ['pair', 'archetype', 'tenor_days'] : ['pair', 'archetype', 'tenor_days', 'regime'];
  const src = U.tab === 'oos' ? D.walk_forward : D.ladder;
  for (const d of dims) {
    const vals = uniq(src, d); if (!vals.length) continue;
    const row = document.createElement('div'); row.className = 'frow';

    else U.ex.c1 = {stat: bstat, op: 'between', v1: +row.lo.toFixed(4), v2: +row.hi.toFixed(4), cats: new Set()};
    render(); window.scrollTo(0, 0); return; }
  if (th) { const id = th.closest('table').dataset.t, s = U.sort[id]; U.sort[id] = s && s.k === th.dataset.k ? {k: s.k, d: !s.d} : {k: th.dataset.k, d: true}; render(); }
  else if (td) { U.f.pair = new Set([td.dataset.p]); U.f.archetype = new Set([td.dataset.a]); U.f.tenor_days = new Set([+td.dataset.t]); Object.assign(U.lad, {x: 'h', lines: 'regime', panels: 'none', metric: U.mat.metric, vsAll: U.mat.vsAll}); U.tab = 'ladder'; render(); window.scrollTo(0, 0); }
});
document.getElementById('title').textContent = (D.label || 'regime ladder') + ' · view';
document.getElementById('sub').textContent = `${D.pairs.join(', ')} · generated ${D.generated}`;
render();
</script>
